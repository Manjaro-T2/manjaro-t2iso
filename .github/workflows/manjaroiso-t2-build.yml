---
name: iso_build
"on":
  workflow_dispatch:
  push:
    branches:
      - '**'

permissions:
  contents: write

concurrency:
  group: iso-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - id: time
        uses: nanzm/get-time-action@v1.1
        with:
          format: 'YYYYMMDDHHmm'
      - id: version
        env:
          RELEASE_TAG: ${{ steps.time.outputs.time }}
        shell: bash
        run: |
          echo "version=${RELEASE_TAG:2:2}.${RELEASE_TAG:4:2}-t2" \
            >> "$GITHUB_OUTPUT"
    outputs:
      # generate a common tag to be used in all elements of the matrix strategy
      release_tag: ${{ steps.time.outputs.time }}
      release_version: ${{ steps.version.outputs.version }}
  release:
    runs-on: ubuntu-latest
    needs: prepare-release
    strategy:
      matrix:
        ##### EDIT ME #####
        edition: [cinnamon, gnome, kde, i3, xfce, hyprland]
        branch: [stable]
        scope: [full]
        ###################
    steps:
      - id: image-build
        uses: manjaro/manjaro-iso-action@main
        with:
          iso-profiles-repo: "https://github.com/RishonDev/manjaro-t2iso"
          edition: ${{ matrix.edition }}
          branch: ${{ matrix.branch }}
          scope: ${{ matrix.scope }}
          version: ${{ needs.prepare-release.outputs.release_version }}
          kernel: linux618-t2
          code-name: "Arh Linh "
          # providing a release-tag allows for github releases
          release-tag: ${{ needs.prepare-release.outputs.release_tag }}

      # delete the github release in case of cancellation or failure
      # refer to .github/workflows/cleanup-test-release.yml for rollback
      # strategies concerning the other distribution channels
      - name: rollback github release
        if: ${{ failure() || cancelled() }}
        run: |
          echo ${{ github.token }} | gh auth login --with-token
          gh release delete ${{ needs.prepare-release.outputs.release_tag }} \
            -y \
            --repo ${{ github.repository }}
          git push --delete \
            origin \
            ${{ needs.prepare-release.outputs.release_tag }}

  generate-release-metadata:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - release
    if: ${{ needs.release.result == 'success' }}
    steps:
      - name: Generate distro metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" \
            --repo "$REPO" \
            --json assets > release-assets.json
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess
          import tempfile
          from pathlib import Path

          edition_names = {
              "cinnamon": "Manjaro Cinnamon",
              "gnome": "Manjaro GNOME",
              "kde": "Manjaro KDE",
              "i3": "Manjaro i3",
              "xfce": "Manjaro XFCE",
              "hyprland": "Manjaro Hyprland",
          }

          repo = os.environ["REPO"]
          tag = os.environ["RELEASE_TAG"]

          with open("release-assets.json", "r", encoding="utf-8") as handle:
              assets = json.load(handle)["assets"]

          grouped = {}
          sha_asset_by_edition = {}

          for asset in assets:
              name = asset["name"]
              url = f"https://github.com/{repo}/releases/download/{tag}/{name}"

              iso_match = re.match(
                  r"^manjaro-([a-z0-9-]+)-.*\.iso(?:\..+)?$",
                  name,
              )
              if iso_match and ".sha" not in name.lower():
                  edition = iso_match.group(1)
                  grouped.setdefault(edition, []).append(url)
                  continue

              sha_match = re.match(
                  r"^manjaro-([a-z0-9-]+)-.*"
                  r"(?:sha256|sha256sum)(?:\..*)?$",
                  name,
                  re.IGNORECASE,
              )
              if not sha_match:
                  continue

              edition = sha_match.group(1)
              sha_asset_by_edition[edition] = name

          sha_by_edition = {}
          if sha_asset_by_edition:
              with tempfile.TemporaryDirectory() as tmpdir:
                  for edition, asset_name in sha_asset_by_edition.items():
                      subprocess.run(
                          [
                              "gh",
                              "release",
                              "download",
                              tag,
                              "--repo",
                              repo,
                              "--pattern",
                              asset_name,
                              "--dir",
                              tmpdir,
                          ],
                          check=True,
                      )
                      checksum_path = Path(tmpdir, asset_name)
                      text = checksum_path.read_text(
                          encoding="utf-8",
                          errors="ignore",
                      )
                      edition_pattern = re.compile(
                          rf"([0-9a-fA-F]{{64}})\s+.*manjaro-{re.escape(edition)}-.*",
                          re.IGNORECASE,
                      )
                      match = edition_pattern.search(text)
                      if match is None:
                          match = re.search(r"\b([0-9a-fA-F]{64})\b", text)
                      if match is not None:
                          sha_by_edition[edition] = match.group(1).lower()

          metadata = {"all": []}
          for edition in sorted(grouped):
              entry = {
                  "name": edition_names.get(
                      edition,
                      f"Manjaro {edition.title()}",
                  ),
                  "iso": sorted(grouped[edition]),
              }
              if edition in sha_by_edition:
                  entry["sha256"] = sha_by_edition[edition]
              metadata["all"].append(entry)

          with open("distro-metadata.json", "w", encoding="utf-8") as handle:
              json.dump(metadata, handle, indent=2)
              handle.write("\n")
          PY

      - name: Upload distro metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" distro-metadata.json \
            --repo "${{ github.repository }}" \
            --clobber
