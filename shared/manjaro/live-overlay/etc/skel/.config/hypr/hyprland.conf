# EXEC
# exec-once = wl-clipboard-history -t
exec-once = ~/.config/hypr/xdg-portal-hyprland
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = chmod +x $HOME/.config/hypr/screenshot.sh
exec-once = skippy-xd --start-daemon
exec-once = hypridle

# exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent0
# exec-once = wlsunset -S 9:00 -s 19:30
exec = swaybg -m fill -i ~/.config/hypr/Manjaro2.png
exec-once = waybar &
exec-once = nm-applet
exec = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once=mako &
$HYPRSCRIPTS = ~/.config/hypr/
$NWGSCRIPTS = ~/.config/nwg-dock-hyprland/
exec-once=$NWGSCRIPTS/launch.sh default
exec=nwg-dock-hyprland
#MONITOR
monitor = ,preferred,auto,1
#INPUT
input {
  kb_layout = us
  kb_options = grp:alt_space_toggle
  follow_mouse = 1
  sensitivity = -0.5 # -1.0 - 1.0, 0 means no modification.
}

#GENERAL
general {
  gaps_in=10
  gaps_out=10
  border_size=2
  col.active_border = rgba(16a187aa) rgba(2DA000aa)
  layout = dwindle
}

#MISC
misc {
  disable_hyprland_logo = true
  disable_splash_rendering = true
  mouse_move_enables_dpms = true
  enable_swallow = true
  swallow_regex = ^(kitty)$
}

#DECORATION
decoration {
  #ROUNDING
  rounding = 8

  #OPACITY
  active_opacity = 1.0
  inactive_opacity = 0.98
}

#LAYOUT
dwindle {
  pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
  preserve_split = true # you probably want this
}

#WINDOW RULES
windowrule = match:class file_progress, float on
windowrule = match:title confirm, float on

windowrule = match:title dialog, float on
windowrule = match:title download, float on
windowrule = match:title notification, float on
windowrule = match:title error, float on
windowrule = match:title splash, float on
windowrule = match:title confirmreset, float on
windowrule = match:title "Open File", float on
windowrule = match:title branchdialog, float on
windowrule = match:class Lxappearance, float on
windowrule = match:class Rofi, float on
windowrule = match:class viewnior, float on
windowrule = match:class feh, float on
windowrule = match:class file-roller, float on
windowrule = match:title wlogout, float on
windowrule = match:title wlogout, fullscreen on
windowrule = match:title "Media viewer", float on
windowrule = match:title "Volume Control", float on
windowrule = match:title "Picture-in-Picture", float on
windowrule = match:title "Volume Control", size 40% 50%
windowrule = match:title "Volume Control", move 60% 6%
windowrule = match:class mpv, idle_inhibit focus
windowrule = match:class firefox, idle_inhibit fullscreen
windowrule = match:class Rofi, animation none

#KEYBIND
bind = SUPER, B, exec, firefox 
bind = SUPER, RETURN, exec, kitty
bind = SUPER, P, exec, wlogout
bind = SUPER, T, exec, kitty
bind = SUPER, R, exec, hyprctl reload
# Alt + Tab window switcher
bind = ALT, Tab, exec, rofi -show window
bind = SUPER, Tab, cyclenext
bind = SUPER SHIFT,Tab, cyclenext, prev
# bind = SUPER, F1, exec, ~/.config/hypr/keybind

#MULTIMEDIA
binde=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=, XF86AudioPlay, exec, playerctl play-pause
bind=, XF86AudioPause, exec, playerctl play-pause
bind=, XF86AudioNext, exec, playerctl next
bind=, XF86AudioPrev, exec, playerctl previous

#SCREENSHOT
#bind = ,Print, exec, $HYPRSCRIPTS/screenshot fullscreen
#bind = SUPER SHIFT, 3, exec, $HYPRSCRIPTS/screenshot fullscreen
#bind = SUPER SHIFT, 4, exec, $HYPRSCRIPTS/screenshot area
#bind = SUPER SHIFT, 5 , exec, $HYPRSCRIPTS/screenshot window

bind = CTRL SHIFT, 3, exec,$HYPRSCRIPTS/screenshot fullscreen
# Area select (⌘⇧4)
bind = CTRL SHIFT, 4, exec,$HYPRSCRIPTS/screenshot area
# Active window (⌘⇧5)
bind = CTRL SHIFT, 5, exec,$HYPRSCRIPTS/screenshot window

bind = SUPER,Space , exec, rofi -show drun

#MISC
bind = SUPER, E, exec, nautilus
#bind = SUPER, R, exec, killall wofi || wofi --show drun 
#bind = SUPER SHIFT, R, exec, killall wofi || wofi --show run 
bind = SUPER, period, exec, killall rofi || rofi -show emoji -emoji-format "{emoji}" -modi emoji -theme ~/.config/rofi/global/emoji
bind = SUPER, escape, exec, wlogout --protocol layer-shell -b 5 -T 400 -B 400

#WINDOW MANAGEMENT
bind = SUPER, Q, killactive,
bind = SUPER, F, fullscreen,
bind = SUPER, Space, togglefloating,
bind = SUPER, S, togglesplit, # dwindle


#FOCUS
bind = SUPER, h, movefocus, l
bind = SUPER, l, movefocus, r
bind = SUPER, k, movefocus, u
bind = SUPER, j, movefocus, d

#MOVE
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, l, movewindow, r
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, j, movewindow, d

#RESIZE
bind = SUPER CTRL, h, resizeactive, -20 0
bind = SUPER CTRL, l, resizeactive, 20 0
bind = SUPER CTRL, k, resizeactive, 0 -20
bind = SUPER CTRL, j, resizeactive, 0 20

#TABBED
bind= SUPER, g, togglegroup,
bind= SUPER, tab, changegroupactive,

#SWITCH
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER ALT, up, workspace, e+1
bind = SUPER ALT, down, workspace, e-1

#MOVETO
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

#MOUSE BINDING
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
