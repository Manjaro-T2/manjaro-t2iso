general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/.config/hypr/Manjaro2.png

    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 1.1
    brightness = 0.9
    vibrancy = 0.18
    vibrancy_darkness = 0.25
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(220, 230, 225, 0.95)
    font_size = 96
    font_family = Cantarell
    position = 0, 280
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(180, 200, 190, 0.85)
    font_size = 22
    font_family = Cantarell
    position = 0, 190
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/pfp.jpg

    size = 120, 120
    rounding = -1          # circle
    border_size = 2
    border_color = rgba(53, 132, 103, 0.9)  # Manjaro green

    position = -10, 50
    halign = center
    valign = center
}

# Password box (frosted glass look)
input-field {
    monitor =
    size = 320, 52
    position = 0, -120
    halign = center
    valign = center

    outer_color = rgba(53, 132, 103, 0.9)   # Manjaro green
    inner_color = rgba(25, 30, 28, 0.55)
    font_color = rgba(220, 230, 225, 1.0)

    rounding = 12
    outline_thickness = 2
    dots_center = true
    dots_spacing = 0.25
    dots_rounding = -1
    fade_on_empty = true
    placeholder_text = <span foreground="##9fb9ad">Password</span>
}

# Status text
label {
    monitor =
    text = $USER
    color = rgba(160, 190, 175, 0.75)
    font_size = 18
    font_family = Cantarell
    position = 0, -60
    halign = center
    valign = center
}


